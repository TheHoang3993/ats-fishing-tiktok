name: Dang TikTok ATS FISHING

on:
  schedule:
    # 12:00 UTC = 19:00 giờ Việt Nam, mỗi ngày. GitHub có thể trễ vài phút.
    - cron: "0 12 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tiktok-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install requests

      - name: Đăng video tiếp theo
        run: python scripts/post_next.py
        env:
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
          # Đổi thành PUBLIC_TO_EVERYONE sau khi TikTok duyệt app
          TIKTOK_PRIVACY: SELF_ONLY
          # Tùy chọn: PAT để tự lưu refresh token mới
          GH_PAT: ${{ secrets.GH_PAT }}

      - name: Ghi lại video đã đăng
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --cached --quiet || (git commit -m "Đánh dấu video đã đăng" && git push)
